name: Przetwarzanie rozmów

on:
  push:
    branches: [main]
    paths:
      - "ops/transkrypcje/**/*.md"
  workflow_dispatch:
    inputs:
      sciezka:
        description: "Ścieżka transkrypcji (puste = tylko wykryte w ostatnim pushu)"
        required: false
        default: ""

# Jedna rozmowa naraz: karty klientów i rejestr są wspólnym stanem w repo.
concurrency:
  group: przetworz-rozmowy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  przetworz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Sekrety tylko jako zmienne środowiskowe; nigdzie ich nie wypisujemy.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RINVO_MODEL: ${{ vars.RINVO_MODEL }}
    steps:
      # Zawsze najnowszy main (nie SHA z chwili pushu): przebiegi idą po kolei,
      # a poprzedni mógł już zaktualizować karty klientów i rejestr.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node.js (dla Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zależności
        run: |
          pip install certifi
          npm install -g @anthropic-ai/claude-code

      - name: Wykryj transkrypcje
        id: wykryj
        env:
          SCIEZKA: ${{ github.event.inputs.sciezka }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > /tmp/transkrypcje.txt

          if [ -n "${SCIEZKA:-}" ]; then
            if [ ! -f "$SCIEZKA" ]; then
              echo "::error::Brak pliku: $SCIEZKA"
              exit 1
            fi
            printf '%s\n' "$SCIEZKA" > /tmp/transkrypcje.txt
          else
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$ZERO" ]; then
              # Pierwszy push (brak poprzedniego commita): wszystkie transkrypcje.
              # Już przetworzone pominie rejestr sha256 w przetworz.py.
              git ls-files 'ops/transkrypcje/**/*.md' 'ops/transkrypcje/*/*.md' \
                | sort -u > /tmp/transkrypcje.txt
            elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" \
                -- 'ops/transkrypcje/**/*.md' > /tmp/transkrypcje.txt
            else
              # Poprzedni commit niedostępny (np. force-push): tylko ostatni commit.
              git diff-tree --no-commit-id --name-only -r --root --diff-filter=AM "$SHA" \
                -- 'ops/transkrypcje/**/*.md' > /tmp/transkrypcje.txt
            fi
          fi

          # transkrypcje, które czekały na limit modelu, wracają do listy przy następnym przebiegu
          python3 limity.py --dopisz-kolejke /tmp/transkrypcje.txt

          # tylko istniejące pliki (zmienione mogły zostać potem usunięte)
          while IFS= read -r f; do [ -f "$f" ] && echo "$f"; done < /tmp/transkrypcje.txt \
            | sort -u > /tmp/transkrypcje.ok
          mv /tmp/transkrypcje.ok /tmp/transkrypcje.txt

          N=$(wc -l < /tmp/transkrypcje.txt | tr -d ' ')
          echo "liczba=$N" >> "$GITHUB_OUTPUT"
          echo "Transkrypcje do przetworzenia: $N"
          cat /tmp/transkrypcje.txt

      # Diagnostyka logowania: te same flagi i model co w przetworz.py.
      # Pokazuje, czy CLAUDE_CODE_OAUTH_TOKEN działa na serwerze, zanim ruszy analiza.
      - name: Diagnostyka Claude
        id: diag
        if: steps.wykryj.outputs.liczba != '0'
        run: |
          set -uo pipefail
          MODEL="${RINVO_MODEL:-}"
          MODEL="${MODEL:-claude-sonnet-5-5}"
          echo "Model: $MODEL"
          echo "Wersja: $(claude --version 2>&1)"
          # Sekrety wklejone z Notatek mogą mieć enter, \u2028 itp. — czyścimy jak przetworz.py.
          for NAZWA in CLAUDE_CODE_OAUTH_TOKEN LINEAR_API_KEY SLACK_WEBHOOK_URL; do
            PRZED="${!NAZWA:-}"
            export "$NAZWA=$(python3 sekrety.py "$NAZWA")"
            PO="${!NAZWA:-}"
            if [ "${#PRZED}" -ne "${#PO}" ]; then
              echo "::warning::$NAZWA zawierał białe/niewidoczne znaki ($(( ${#PRZED} - ${#PO} )) usunięto) — popraw sekret w GitHubie"
            fi
          done
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN: ustawiony (długość ${#CLAUDE_CODE_OAUTH_TOKEN})"
          else
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN jest pusty lub nieustawiony (Settings → Secrets → Actions)"
            exit 1
          fi
          [ -n "${LINEAR_API_KEY:-}" ] && echo "LINEAR_API_KEY: ustawiony" || echo "::warning::LINEAR_API_KEY pusty"
          [ -n "${SLACK_WEBHOOK_URL:-}" ] && echo "SLACK_WEBHOOK_URL: ustawiony" || echo "::warning::SLACK_WEBHOOK_URL pusty"

          set +e
          ODP=$(claude -p "Odpowiedz jednym słowem: OK" \
                  --model "$MODEL" \
                  --allowedTools "Read,Write,Edit,Bash" \
                  --dangerously-skip-permissions < /dev/null 2>&1)
          RC=$?
          set -e
          echo "Kod wyjścia: $RC"
          echo "Odpowiedź: $ODP"
          if [ "$RC" -ne 0 ]; then
            if python3 limity.py --czy-limit "$ODP"; then
              # limit sesji / kredytów: to nie awaria. Zadania czekają w kolejce „oczekuje na limit”, jedna informacja na Slacku,
              # przebieg kończy się na zielono i ponawia się przy następnym uruchomieniu.
              echo "limit=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Limit sesji albo kredytów modelu: zadania czekają w kolejce, ponowienie przy następnym przebiegu"
              exit 0
            fi
            echo "::error::claude -p nie działa na serwerze (kod $RC): $ODP"
            exit 1
          fi

      - name: Limit modelu – kolejka i informacja
        if: steps.diag.outputs.limit == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          python3 limity.py --kolejkuj /tmp/transkrypcje.txt --powiadom
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ops/.kolejka_limit.json ops/.maile.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "[automat] limit modelu: kolejka [skip ci]"
          for proba in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; exit 1; }
          done
          exit 1

      - name: Przetwórz
        if: steps.wykryj.outputs.liczba != '0' && steps.diag.outputs.limit != 'true'
        run: |
          set -uo pipefail
          touch /tmp/start_przetwarzania
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          zapisz() {
            local plik="$1"
            python3 generuj_strony.py || echo "::warning::Strony nie zostały odświeżone"
            for sciezka in wyniki ops/klienci ops/produkt ops/.przetworzone.json logi/przebiegi index.html klienci glos-klientow.html ops/.stan_linear.json ops/.zdarzenia.json ops/.sygnaly.json ops/.reczne_zmiany.json ops/.zmiany_automatu.json ops/.zuzycie_modelu.json ops/.kolejka_limit.json ops/materialy; do
              [ -e "$sciezka" ] && git add -A -- "$sciezka"
            done
            if git diff --cached --quiet; then
              echo "Brak zmian do zapisania dla $plik"
              return 0
            fi
            # [skip ci] + push tokenem GITHUB_TOKEN: ten commit nie odpali workflow ponownie.
            git commit -q -m "[automat] przetworzono $plik [skip ci]"
            for proba in 1 2 3; do
              if git push origin HEAD:main; then
                return 0
              fi
              echo "Push odrzucony (próba $proba/3), pull --rebase…"
              git pull --rebase origin main || { git rebase --abort 2>/dev/null; return 1; }
            done
            return 1
          }

          BLEDY=0
          while IFS= read -r plik; do
            echo "::group::przetworz.py $plik"
            python3 przetworz.py "$plik"
            RC=$?
            echo "::endgroup::"
            if [ "$RC" -eq 75 ]; then
              # limit/kredyty modelu albo dzienny bezpiecznik: zadanie czeka w kolejce, to nie błąd ani nieudana próba
              echo "::warning::$plik czeka na limit modelu (kolejka); ponowienie przy następnym przebiegu"
            elif [ "$RC" -ne 0 ]; then
              echo "::error::przetworz.py zakończył się błędem dla $plik (kod $RC)"
              BLEDY=$((BLEDY + 1))
            fi
            # zapisz to, co powstało (także log nieudanego przebiegu)
            zapisz "$plik" || { echo "::error::Nie udało się wypchnąć wyników dla $plik"; BLEDY=$((BLEDY + 1)); }
          done < /tmp/transkrypcje.txt

          if [ "$BLEDY" -ne 0 ]; then
            echo "::error::Błędy: $BLEDY"
            exit 1
          fi

      # Gdy cokolwiek się wysypie: ostatnie 60 linii logu (bez kluczy) i cały folder logów jako artifact.
      - name: Ostatnie linie logu przebiegu
        if: failure()
        run: |
          python3 - <<'EOF'
          import os, re, glob
          from pathlib import Path

          def redact(t):
              for n in ("CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY", "LINEAR_API_KEY", "SLACK_WEBHOOK_URL"):
                  v = os.environ.get(n, "")
                  if len(v) >= 8:
                      t = t.replace(v, "***")
              for pat in (r"lin_api_\w+", r"https://hooks\.slack\.com/\S+", r"sk-ant-[\w-]+"):
                  t = re.sub(pat, "***", t)
              return re.sub(r"(?i)(bearer\s+)[\w.~+/=-]{12,}", r"\1***", t)

          logi = sorted(glob.glob("logi/przebiegi/*.log"), key=os.path.getmtime)
          start = Path("/tmp/start_przetwarzania")
          if start.exists():
              logi = [l for l in logi if os.path.getmtime(l) >= start.stat().st_mtime]
          if not logi:
              print("Brak logów przebiegu z tego uruchomienia (błąd przed przetwarzaniem).")
          for l in logi:
              linie = Path(l).read_text(encoding="utf-8", errors="replace").splitlines()
              print(f"::group::{l} (ostatnie 60 linii)")
              print(redact("\n".join(linie[-60:])))
              print("::endgroup::")
          EOF
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Logi jako artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logi-przebiegi-${{ github.run_id }}
          path: logi/przebiegi
          if-no-files-found: ignore
          retention-days: 14
