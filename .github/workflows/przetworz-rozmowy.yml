name: Przetwarzanie rozmów

on:
  push:
    branches: [main]
    paths:
      - "ops/transkrypcje/**/*.md"
  workflow_dispatch:
    inputs:
      sciezka:
        description: "Ścieżka transkrypcji (puste = tylko wykryte w ostatnim pushu)"
        required: false
        default: ""

# Jedna rozmowa naraz: karty klientów i rejestr są wspólnym stanem w repo.
concurrency:
  group: przetworz-rozmowy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  przetworz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Sekrety tylko jako zmienne środowiskowe; nigdzie ich nie wypisujemy.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RINVO_MODEL: ${{ vars.RINVO_MODEL }}
    steps:
      # Zawsze najnowszy main (nie SHA z chwili pushu): przebiegi idą po kolei,
      # a poprzedni mógł już zaktualizować karty klientów i rejestr.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node.js (dla Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zależności
        run: |
          pip install certifi
          npm install -g @anthropic-ai/claude-code

      - name: Wykryj transkrypcje
        id: wykryj
        env:
          SCIEZKA: ${{ github.event.inputs.sciezka }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > /tmp/transkrypcje.txt

          if [ -n "${SCIEZKA:-}" ]; then
            if [ ! -f "$SCIEZKA" ]; then
              echo "::error::Brak pliku: $SCIEZKA"
              exit 1
            fi
            printf '%s\n' "$SCIEZKA" > /tmp/transkrypcje.txt
          else
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$ZERO" ]; then
              # Pierwszy push (brak poprzedniego commita): wszystkie transkrypcje.
              # Już przetworzone pominie rejestr sha256 w przetworz.py.
              git ls-files 'ops/transkrypcje/**/*.md' 'ops/transkrypcje/*/*.md' \
                | sort -u > /tmp/transkrypcje.txt
            elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" \
                -- 'ops/transkrypcje/**/*.md' > /tmp/transkrypcje.txt
            else
              # Poprzedni commit niedostępny (np. force-push): tylko ostatni commit.
              git diff-tree --no-commit-id --name-only -r --root --diff-filter=AM "$SHA" \
                -- 'ops/transkrypcje/**/*.md' > /tmp/transkrypcje.txt
            fi
          fi

          # tylko istniejące pliki (zmienione mogły zostać potem usunięte)
          while IFS= read -r f; do [ -f "$f" ] && echo "$f"; done < /tmp/transkrypcje.txt \
            | sort -u > /tmp/transkrypcje.ok
          mv /tmp/transkrypcje.ok /tmp/transkrypcje.txt

          N=$(wc -l < /tmp/transkrypcje.txt | tr -d ' ')
          echo "liczba=$N" >> "$GITHUB_OUTPUT"
          echo "Transkrypcje do przetworzenia: $N"
          cat /tmp/transkrypcje.txt

      - name: Przetwórz
        if: steps.wykryj.outputs.liczba != '0'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          zapisz() {
            local plik="$1"
            for sciezka in wyniki ops/klienci ops/produkt ops/.przetworzone.json logi/przebiegi; do
              [ -e "$sciezka" ] && git add -A -- "$sciezka"
            done
            if git diff --cached --quiet; then
              echo "Brak zmian do zapisania dla $plik"
              return 0
            fi
            # [skip ci] + push tokenem GITHUB_TOKEN: ten commit nie odpali workflow ponownie.
            git commit -q -m "[automat] przetworzono $plik [skip ci]"
            for proba in 1 2 3; do
              if git push origin HEAD:main; then
                return 0
              fi
              echo "Push odrzucony (próba $proba/3), pull --rebase…"
              git pull --rebase origin main || { git rebase --abort 2>/dev/null; return 1; }
            done
            return 1
          }

          BLEDY=0
          while IFS= read -r plik; do
            echo "::group::przetworz.py $plik"
            python3 przetworz.py "$plik"
            RC=$?
            echo "::endgroup::"
            if [ "$RC" -ne 0 ]; then
              echo "::error::przetworz.py zakończył się błędem dla $plik (kod $RC)"
              BLEDY=$((BLEDY + 1))
            fi
            # zapisz to, co powstało (także log nieudanego przebiegu)
            zapisz "$plik" || { echo "::error::Nie udało się wypchnąć wyników dla $plik"; BLEDY=$((BLEDY + 1)); }
          done < /tmp/transkrypcje.txt

          if [ "$BLEDY" -ne 0 ]; then
            echo "::error::Błędy: $BLEDY"
            exit 1
          fi
