name: Codzienne podsumowanie

on:
  schedule:
    # Cron działa w UTC. 08:00 w Polsce to 06:00 UTC latem (CEST) i 07:00 UTC zimą (CET), więc odpalamy
    # o obu godzinach, a podsumowanie.py samo sprawdza czas w Europe/Warsaw i wysyła raz dziennie.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

# Ta sama grupa co przetwarzanie rozmów i maili: podsumowanie zapisuje karty klientów (licznik przypomnień).
concurrency:
  group: przetworz-rozmowy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  podsumowanie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zależności
        run: |
          pip install certifi tzdata fpdf2
          sudo apt-get install -y -q fonts-dejavu-core

      # Ręczne uruchomienie wysyła zawsze (--wymus); cron tylko w oknie 8:00-12:00 czasu polskiego, raz dziennie.
      - name: Podsumowanie
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RECZNIE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail
          if [ "$RECZNIE" = "true" ]; then
            python3 podsumowanie.py --wymus
          else
            python3 podsumowanie.py
          fi

      # Notatka przed spotkaniem (materiał WEWNĘTRZNY): dzień przed każdym spotkaniem z karty klienta agent tworzy
      # ops/materialy/<klient>/notatka-<data>.md i .pdf, link idzie do komentarza zadania i na Slacka. Idempotentne.
      - name: Node.js (dla Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Notatki przed spotkaniami
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RINVO_MODEL: ${{ vars.RINVO_MODEL }}
        run: |
          set -uo pipefail
          export CLAUDE_CODE_OAUTH_TOKEN="$(python3 sekrety.py CLAUDE_CODE_OAUTH_TOKEN)"
          python3 notatka_spotkania.py || echo "::warning::Notatka przed spotkaniem nie powstała (patrz log powyżej)"

      # Szkice przypomnień zwiększają licznik wykorzystanych przypomnień w karcie: zapisujemy go w repo.
      - name: Zapisz karty i stan
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 generuj_strony.py || echo "::warning::Strony nie zostały odświeżone"
          for sciezka in ops/klienci ops/.podsumowanie.json index.html klienci glos-klientow.html ops/.stan_linear.json ops/.zdarzenia.json ops/.sygnaly.json ops/materialy; do
            [ -e "$sciezka" ] && git add -A -- "$sciezka"
          done
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania"
            exit 0
          fi
          git commit -q -m "[automat] podsumowanie dzienne [skip ci]"
          for proba in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push odrzucony (próba $proba/3), pull --rebase…"
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; exit 1; }
          done
          exit 1
